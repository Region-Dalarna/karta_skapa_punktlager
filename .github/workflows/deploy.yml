name: Deploy karta_skapa_punktlager

on:
  push:
    branches: [ publicera ]

jobs:
  deploy:
    runs-on: [ self-hosted, shiny ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy app using server-side script
        run: |
          TEMP_DIR="${GITHUB_WORKSPACE}/app"
          /usr/local/bin/shiny_deploy.sh karta_skapa_punktlager "$TEMP_DIR"

      - name: Regenerera landningssida
        run: |
          sudo /usr/local/bin/generera_landningssida.sh || echo "Varning: kunde inte regenerera landningssidan (ej kritiskt fel)"

